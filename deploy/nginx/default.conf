server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # MEDIA_MAX_BYTES (5 MiB) plus the multipart overhead.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # No security headers here: the API sets its own on every response.
    location /api/ {
        # Docker's DNS, read per request so restarting the API cannot leave
        # nginx holding its old address.
        resolver 127.0.0.11 valid=2s;
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        # The API compares Origin with Host to refuse cross-origin requests.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Longer than the server's own 30s write timeout.
        proxy_read_timeout 35s;
    }

    # File names carry a content hash.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes all load the app, which must never be served stale.
    location / {
        include /etc/nginx/security-headers.conf;
        expires -1;
        try_files $uri /index.html;
    }
}
